[package]
name = "video-vacuum"
version = "2.1.0"
description = "Video Vacuum: a small desktop app that downloads YouTube videos with yt-dlp."
authors = ["TheMysticTurtle"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "video_vacuum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.11.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
